<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>comic-sfx render stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Passion+One:wght@900&family=Rubik+Mono+One&family=Anton&display=swap">
<link rel="stylesheet" href="/comic-sfx.css">
<style>
  /* transparent all the way down: the screenshot is taken with
     omitBackground, and any painted background would become a matte */
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="stage"></div>
</body>
</html>
