<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker pack 1 — 320×270</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Passion+One:wght@900&family=Rubik+Mono+One&family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./comic-sfx.css">
<style>
  body{margin:0;background:#141416;color:#CFC9BF;font-family:'IBM Plex Mono',monospace;padding:22px 24px 40px}
  h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9A9388;margin:0 0 4px}
  p.note{font-size:12px;color:#8A8378;margin:0 0 18px;line-height:1.6}
  .bar{display:flex;gap:8px;margin-bottom:20px}
  button{
    font:inherit;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    background:#232326;color:#CFC9BF;border:1px solid #3A3A3D;padding:7px 13px;cursor:pointer;
  }
  button:hover{border-color:#E8482C;color:#E8482C}
  .grid{display:grid;grid-template-columns:repeat(4,320px);gap:14px 16px}
  .cell{display:flex;flex-direction:column;gap:5px}
  .chat{width:320px;height:270px;position:relative;overflow:hidden}
  .chat.dark{background:#1F2733}
  .chat.light{background:#DDE6EF}
  .label{font-size:11px;color:#9A9388;letter-spacing:.05em}
  .label b{color:#E8482C;font-weight:500}
  .says{font-size:10.5px;color:#726B61}
</style>
</head>
<body>
  <h1>Sticker pack 1 — actual size</h1>
  <p class="note">320 × 270, LINE's maximum. Each word on a dark and a light chat background, because a sticker has to hold on both.</p>
  <div class="bar">
    <button id="fire">Fire all</button>
    <button id="pose">Freeze at rest</button>
  </div>
  <div class="grid" id="grid"></div>

<script type="module">
import { ComicSFX } from './comic-sfx.js';
import { PACK_1 } from './sticker-pack.js';

const grid = document.getElementById('grid');
const rigs = [];

for (const rec of PACK_1){
  for (const ground of ['dark','light']){
    const cell = document.createElement('div'); cell.className = 'cell';
    const lab = document.createElement('div'); lab.className = 'label';
    lab.innerHTML = '<b>' + rec.word + '</b> · ' + ground;
    const says = document.createElement('div'); says.className = 'says';
    says.textContent = rec.says;
    const chat = document.createElement('div'); chat.className = 'chat ' + ground;
    cell.append(lab, says, chat); grid.appendChild(cell);

    const sfx = new ComicSFX(chat);
    sfx.dim.remove();                     // a sticker has no panel behind it
    rigs.push({ sfx, rec });
  }
}

function fireAll(){
  for (const r of rigs){
    r.sfx.layer.querySelectorAll(':scope > div').forEach(n => { if (n !== r.sfx.dim) n.remove(); });
    r.sfx.fire(r.rec, {});
  }
}
/* animations are throttled in a background tab, so hold each one at its
   resting frame: finish the entrance, rewind the exit */
function pose(){
  for (const r of rigs)
    for (const el of r.sfx.layer.querySelectorAll('*'))
      for (const a of el.getAnimations()){
        const n = a.animationName || '';
        if (n === 'omSnap' || n === 'omDrift') { a.currentTime = 0; continue; }
        const d = (a.effect && a.effect.getTiming().duration) || 0;
        a.currentTime = (d && isFinite(d)) ? d : 45;
      }
}
document.getElementById('fire').onclick = fireAll;
document.getElementById('pose').onclick = () => { fireAll(); setTimeout(pose, 40); };
window.fireAll = fireAll; window.pose = pose; window.rigs = rigs;

await document.fonts.ready;
fireAll();
setInterval(fireAll, 2800);
</script>
</body>
</html>
